name: Build & Release Print Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GCC (MinGW)
        run: choco install mingw -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download SumatraPDF portable
        shell: pwsh
        run: |
          $url = "https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.exe"
          Invoke-WebRequest -Uri $url -OutFile "assets/SumatraPDF.exe"
          Write-Host "SumatraPDF baixado: $((Get-Item assets/SumatraPDF.exe).Length / 1MB) MB"

      - name: Build
        shell: pwsh
        run: |
          wails build --platform windows/amd64 `
            -ldflags "-X main.Version=${{ github.ref_name }}"

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem build/bin

      - name: Rename binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin/*.exe | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nenhum executável encontrado em build/bin"
            exit 1
          }

          $target = "build/bin/PrintAgent-${{ github.ref_name }}.exe"

          Move-Item $exe.FullName $target

          Write-Host "Renomeado para: $target"

      - name: Verify release file
        shell: pwsh
        run: |
          Get-ChildItem build/bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: build/bin/PrintAgent-${{ github.ref_name }}.exe
          generate_release_notes: true

      - name: Register version on backend
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          $body = @{
            version      = $version
            downloadUrl  = "https://github.com/${{ github.repository }}/releases/download/$version/PrintAgent-$version.exe"
            releaseNotes = "Versão $version"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.API_URL }}/api/agent/version" `
            -Method POST `
            -Headers @{ "X-Api-Key" = "${{ secrets.AGENT_API_KEY }}" } `
            -ContentType "application/json" `
            -Body $body
