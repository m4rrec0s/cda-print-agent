name: Build & Release Print Agent

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GCC (MinGW)
        run: choco install mingw -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: |
          wails build --platform windows/amd64 `
            -ldflags "-X main.Version=${{ github.ref_name }}"

      - name: Rename binary
        run: |
          mv build/bin/cda-print-agent.exe `
             build/bin/PrintAgent-${{ github.ref_name }}.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/PrintAgent-${{ github.ref_name }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register version on backend
        run: |
          $body = @{
            version      = "${{ github.ref_name }}"
            downloadUrl  = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PrintAgent-${{ github.ref_name }}.exe"
            releaseNotes = "Versão ${{ github.ref_name }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.API_URL }}/api/agent/version" `
            -Method POST `
            -Headers @{ "X-Api-Key" = "${{ secrets.AGENT_API_KEY }}" } `
            -ContentType "application/json" `
            -Body $body
